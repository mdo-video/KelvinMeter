name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Estrai progetto
        run: |
          mkdir src
          unzip -q KelvinMeter.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: src
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        working-directory: src
        run: cp app/build/outputs/apk/debug/app-debug.apk KelvinMeter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KelvinMeter
          path: src/KelvinMeter.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KelvinMeter (ultima build)
          files: src/KelvinMeter.apk
          make_latest: true
